<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agro-Pro | Crop Recommendation System | Team Indra</title>
    <link rel="icon" href="static/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #BCBBB8;
      }
      h1 {
        color: mediumseagreen;
        text-align: center;
      }
      .container {
        background: #edf2f7;
        font-weight: bold;
        padding: 15px;
        border-radius: 15px;
        margin: auto;
      }
      .navbar {
        padding: 20px;
        background-color: #6b7908;
      }
      .agro {
        padding: 5px;
        background-color: rgb(192, 249, 135);
        border-radius: 10px;
      }
      .agro a {
        text-decoration: none;
        font-size: 30px;
        font-weight: bold;
        color: black;
      }
      .agro a:hover {
        text-decoration: underline;
      }
      @media (max-width: 768px) {
        .card {
          margin-left: auto;
          margin-right: auto;
        }
        .col-md-4 {
          margin-top: 15px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="agro">
        <a href="#">Agro<span>-Pro</span></a>
      </div>
    </nav>

    <div class="container my-3">
      <h1>Crop Recommendation System 🌱</h1>
      <form action="/predict" method="POST">
        <div class="row">
          <div class="col-md-4">
            <label for="Nitrogen">Nitrogen</label>
            <input type="number" id="Nitrogen" name="Nitrogen" placeholder="Enter Nitrogen" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="Phosporus">Phosphorus</label>
            <input type="number" id="Phosporus" name="Phosporus" placeholder="Enter Phosphorus" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="Potassium">Potassium</label>
            <input type="number" id="Potassium" name="Potassium" placeholder="Enter Potassium" class="form-control" required>
          </div>
        </div>
        <div class="row mt-4">
          <div class="col-md-4">
            <label for="Temperature">Temperature</label>
            <input type="number" step="0.01" id="Temperature" name="Temperature" placeholder="Enter Temperature (°C)" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="Humidity">Humidity</label>
            <input type="number" step="0.01" id="Humidity" name="Humidity" placeholder="Enter Humidity (%)" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="pH">pH</label>
            <input type="number" step="0.01" id="pH" name="pH" placeholder="Enter pH value" class="form-control" required>
          </div>
        </div>
        <div class="row mt-4">
          <div class="col-md-4">
            <label for="Rainfall">Rainfall</label>
            <input type="number" step="0.01" id="Rainfall" name="Rainfall" placeholder="Enter Rainfall (mm)" class="form-control" required>
          </div>
        </div>
        <div class="row mt-4">
          <div class="col-md-12 text-center">
            <button type="submit" class="btn btn-success btn-lg">Get Recommendation</button>
          </div>
        </div>
      </form>
      {% if result %}
        <div class="card bg-dark text-white mt-4">
          <div class="card-body text-center">
            <h5 class="card-title">Recommended Crop:</h5>
            <p class="card-text">{{ result }}</p>
          </div>
        </div>
      {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
